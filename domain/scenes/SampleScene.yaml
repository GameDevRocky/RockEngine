# Sample 2D Scene with only Transform Components
name: "SampleScene"
created_at: "2025-10-17T21:00:00Z"

# List of all Transform components
components:
  - id: "t1"
    type: "Transform"
    gameobject: "o1"
    localPosition: [-1, 0]
    localRotation: 0
    localScale: [1, 1]
    parent_id: null

  - id: "t2"
    type: "Transform"
    gameobject: "o2"
    localPosition: [0, 0]
    localRotation: 0
    localScale: [1, 1]
    parent_id: "t1"

  - id: "s1"
    type: "SpriteRenderer"
    gameobject: "o1"
    material_id: "m1"
    texture_id: "t2"
    color: [1,0,0,1]
    flipX: false
    flipY: false

  - id: "s2"
    type: "SpriteRenderer"
    gameobject: "o2"
    material_id: "m1"
    texture_id: "t1"
    color: [0.5,1,0.5,1]
    flipX: false
    flipY: false

# List of all game objects, referencing only Transform components
gameobjects:
  - id: "o1"
    type: "GameObject"
    name: "Parent"
    components: ["t1", "s1"]

  - id: "o2"
    type: "GameObject"
    name: "Child"
    components: ["t2", "s2"]
