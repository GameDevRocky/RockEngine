# Headless CI for RockEngine.
#
# What this lane is for, and what it deliberately is not:
#
#   It builds RockEngineCore + RockEnginePlayer + the unit tests on Linux/GCC and runs the
#   tests. It does NOT build the Qt editor. That is a deliberate trade -- the editor is
#   built on Windows/MSVC constantly during normal development, so breakage there surfaces
#   within minutes anyway, while GCC catches a genuinely different class of problem (missing
#   transitive includes, stricter -Wall -Wextra, UB that MSVC tolerates) that nothing else
#   here would ever catch.
#
#   No GPU, no window, no display. Everything in Tests/ is pure logic by construction; if a
#   test ever needs a GL context it belongs somewhere else, not in this job.
#
# To add editor coverage later: a second job with jurplel/install-qt-action and
# ROCKENGINE_BUILD_EDITOR=ON compiles it without running it. Linux runners bill at 1x where
# Windows bills at 2x, so that is the cheap way to get it.

name: CI

on:
  push:
    branches: [main, cicd]
  pull_request:

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-headless:
    name: Linux · Engine + tests (GCC)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          # The External/ tree is all submodules and the build cannot configure without it.
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            python3-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxss-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libdecor-0-dev \
            libdrm-dev \
            libgbm-dev \
            libudev-dev \
            libdbus-1-dev
          # python3-dev: RockEngineCore links Python3::Python and pybind11::embed, so the
          #   test binary needs libpython to LINK even though these tests never start an
          #   interpreter.
          #
          # Everything else is SDL3. External/CMakeLists.txt force-sets SDL_VIDEO=ON for
          # RockEnginePlayer, and SDL does NOT quietly disable a backend whose headers are
          # missing -- each SDL_X11_*/SDL_WAYLAND/SDL_KMSDRM option is default-ON and calls
          # SDL_missing_dependency(), which is a hard CMake error. So this is deliberately
          # the whole documented Linux set rather than the minimum that got past the last
          # failure; discovering them one CI run at a time is a slow game of whack-a-mole.
          #   libxss-dev  -> SDL_X11_XSCRNSAVER      libxtst-dev    -> SDL_X11_XTEST
          #   libdrm/gbm  -> SDL_KMSDRM             libdecor-0-dev -> SDL_WAYLAND_LIBDECOR
          #   wayland-protocols is needed to generate the Wayland client headers.
          # (XDBE/XSHAPE/XSYNC ride along on libxext-dev.)
          #
          # No ALSA/Pulse/JACK: SDL_AUDIO is off, miniaudio owns audio.

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ci-linux
          max-size: 500M

      - name: Configure
        run: cmake --preset ci-linux -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build engine, player and tests
        run: cmake --build --preset ci-linux

      - name: Run tests
        run: ctest --preset ci-linux
